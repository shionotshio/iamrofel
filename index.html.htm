<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c0709">
  <meta name="description" content="Rofel · iamrofel">
  <title>Rofel · Profile</title>

  <!-- ================================================================
       ★ QUICK CUSTOMIZATION — EDIT YOUR CONTENT HERE ★
       ----------------------------------------------------------------
       Change the values between the quotation marks below.
       • name:            Your display name
       • role:            The small label above your name; use "" to hide it
       • bio:             Your short introduction; use "" to hide it
       • profileImageUrl: Image URL or local path, e.g. "./avatar.jpg"
                          Leave as "" to use the built-in portrait.
       • audioFileName:   Your local audio file, e.g. "./music.mp3"
                          Put that file in the same folder as index.html.
       • trackTitle:      Song title shown in the player
       • trackArtist:     Artist or subtitle shown in the player
       • initialVolume:   Starting volume from 0 (silent) to 1 (full)

       Music starts after the visitor taps/clicks the entry screen.
       ================================================================ -->
  <script>
    window.PROFILE_CONFIG = {
      name: "Rofel",
      role: "iamrofel",
      bio: "",
      profileImageUrl: "",
      audioFileName: "./damnright.mp3",
      trackTitle: "damn right",
      trackArtist: "Jennie Kim",
      initialVolume: 0.65
    };
  </script>

  <style>
    /* ==============================================================
       ★ VISUAL CUSTOMIZATION — COLORS, FONTS & CARD SIZE ★
       --------------------------------------------------------------
       Edit these variables for a quick restyle. No frameworks or
       external fonts are required; everything works offline.
       ============================================================== */
    :root {
      --page-bg: #0c0709;
      --card-bg: rgba(30, 14, 18, 0.7);
      --card-border: rgba(255, 255, 255, 0.10);
      --text: #f3e8df;
      --muted: #b9a6a5;
      --subtle: #806b6e;
      --accent: #e85a52;
      --accent-rgb: 232, 90, 82;
      --mint: #e8d0c2;
      --danger: #ffb9c2;
      --card-width: 440px;
      --card-radius: 32px;
      --body-font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --display-font: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }

    /* ------------------------- Base & reset ------------------------ */
    *, *::before, *::after { box-sizing: border-box; }

    html { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(22px, 4vw, 48px) 18px;
      overflow-x: hidden;
      color: var(--text);
      background: var(--page-bg);
      font-family: var(--body-font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button, input[type="range"] { touch-action: manipulation; }
    img { max-width: 100%; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }


    /* -------------------- Tap-to-enter experience ------------------ */
    body:not(.is-entered) { overflow: hidden; }

    .entry-gate {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100vh;
      height: 100svh;
      margin: 0;
      padding: 24px;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 44%, rgba(229, 39, 34, 0.08), transparent 34%),
        rgba(10, 5, 7, 0.84);
      -webkit-backdrop-filter: blur(18px) saturate(80%);
      backdrop-filter: blur(18px) saturate(80%);
      cursor: pointer;
      opacity: 1;
      visibility: visible;
      transition: opacity 650ms ease, visibility 650ms ease;
    }

    .entry-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 650ms ease;
    }

    .entry-mark {
      position: relative;
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      margin-bottom: 25px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 50%;
      color: #e8d0c2;
      background: rgba(255, 255, 255, 0.035);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      transition: transform 250ms ease, border-color 250ms ease;
    }

    .entry-mark::before {
      content: "";
      position: absolute;
      inset: -1px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: inherit;
      animation: entry-pulse 2.6s ease-out infinite;
    }

    .entry-mark svg { width: 23px; height: 23px; }

    .entry-name {
      font-family: var(--display-font);
      font-size: 47px;
      font-weight: 400;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    .entry-action {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 24px;
      color: #d8c3bd;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.23em;
      text-transform: uppercase;
    }

    .entry-action::before {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #e85a52;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
    }

    .entry-note {
      margin-top: 10px;
      color: var(--subtle);
      font-size: 10px;
      letter-spacing: 0.04em;
    }

    .entry-gate[hidden] { display: none; }

    .entry-gate.is-leaving {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .entry-gate.is-leaving .entry-content { transform: translateY(-10px); }
    .entry-gate:focus-visible { outline: 2px solid var(--accent); outline-offset: -7px; }

    @keyframes entry-pulse {
      0% { opacity: 0.55; transform: scale(1); }
      75%, 100% { opacity: 0; transform: scale(1.55); }
    }

    @media (hover: hover) {
      .entry-gate:hover .entry-mark { transform: scale(1.045); border-color: rgba(255, 255, 255, 0.3); }
    }

    /* ---------------------- Ambient background --------------------- */
    .ambient {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 40%, rgba(229, 39, 34, 0.08), transparent 44%),
        linear-gradient(145deg, #0c0709 0%, #120a0d 55%, #090608 100%);
    }

    .ambient::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.12;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 68px 68px;
      -webkit-mask-image: radial-gradient(circle at center, black, transparent 72%);
      mask-image: radial-gradient(circle at center, black, transparent 72%);
    }

    .ambient::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.032;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(18px);
      opacity: 0.34;
      animation: drift 18s ease-in-out infinite alternate;
    }

    .orb-one {
      width: min(52vw, 650px);
      aspect-ratio: 1;
      top: -20%;
      left: -12%;
      background: radial-gradient(circle, rgba(229, 39, 34, 0.23), rgba(177, 21, 24, 0.045) 58%, transparent 72%);
    }

    .orb-two {
      width: min(48vw, 600px);
      aspect-ratio: 1;
      right: -12%;
      bottom: -23%;
      background: radial-gradient(circle, rgba(232, 208, 194, 0.055), rgba(82, 37, 37, 0.02) 58%, transparent 72%);
      animation-delay: -7s;
      animation-duration: 22s;
    }

    .orb-three {
      width: min(28vw, 340px);
      aspect-ratio: 1;
      top: 16%;
      right: 4%;
      opacity: 0.28;
      background: radial-gradient(circle, rgba(177, 21, 24, 0.1), transparent 68%);
      animation-delay: -11s;
    }

    @keyframes drift {
      from { transform: translate3d(-2%, -2%, 0) scale(0.96); }
      to { transform: translate3d(5%, 6%, 0) scale(1.08); }
    }

    /* -------------------------- Profile card ----------------------- */
    .profile-wrap {
      position: relative;
      width: min(100%, var(--card-width));
      isolation: isolate;
      opacity: 0.42;
      filter: blur(2px);
      transform: translateY(10px) scale(0.985);
      perspective: 1150px;
      perspective-origin: center;
      transition: opacity 700ms ease, filter 700ms ease, transform 700ms cubic-bezier(0.2, 0.75, 0.25, 1);
    }

    .profile-wrap:focus { outline: none; }

    body.is-entered .profile-wrap {
      opacity: 1;
      filter: none;
      transform: none;
    }

    .profile-wrap::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 12% -9% -6%;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(229, 39, 34, 0.2), rgba(232, 208, 194, 0.035));
      filter: blur(64px);
      opacity: 0.45;
      pointer-events: none;
    }

    .profile-card {
      --pointer-x: 50%;
      --pointer-y: 0%;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --card-x: 0px;
      --card-y: 0px;
      position: relative;
      overflow: hidden;
      padding: 35px 32px 27px;
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.075), transparent 40%),
        var(--card-bg);
      box-shadow:
        0 32px 90px rgba(0, 0, 0, 0.48),
        0 3px 12px rgba(0, 0, 0, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      -webkit-backdrop-filter: blur(28px) saturate(125%);
      backdrop-filter: blur(28px) saturate(125%);
      transform: translate3d(var(--card-x), var(--card-y), 0) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transform-origin: center;
      will-change: transform;
      transition: border-color 400ms ease, box-shadow 400ms ease;
    }

    .profile-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(420px circle at var(--pointer-x) var(--pointer-y), rgba(255, 255, 255, 0.04), transparent 48%);
    }

    .profile-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.48), transparent);
      pointer-events: none;
    }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .profile-card { background-color: rgba(30, 14, 18, 0.97); }
    }

    .identity {
      position: relative;
      text-align: center;
    }

    .avatar-shell {
      position: relative;
      width: 122px;
      aspect-ratio: 1;
      margin: 0 auto 20px;
      padding: 4px;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(232, 208, 194, 0.82), rgba(229, 39, 34, 0.5) 48%, rgba(82, 37, 37, 0.7));
      box-shadow: 0 15px 40px rgba(177, 21, 24, 0.2);
      transform: translate3d(var(--avatar-x, 0px), var(--avatar-y, 0px), 0);
      will-change: transform;
    }

    .avatar-shell::before {
      content: "";
      position: absolute;
      inset: -7px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: inherit;
    }

    .avatar {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 32%;
      border: 3px solid #1b0e12;
      border-radius: 50%;
      background: #281315;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      color: #c3aaa8;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.22em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.65));
    }

    .eyebrow::after { transform: rotate(180deg); }
    .eyebrow[hidden] { display: none; }

    h1 {
      margin: 0 0 11px;
      overflow-wrap: anywhere;
      color: var(--text);
      font-family: var(--display-font);
      font-size: clamp(39px, 7vw, 48px);
      font-weight: 400;
      letter-spacing: -0.045em;
      line-height: 1.08;
      text-shadow: 0 3px 22px rgba(0, 0, 0, 0.25);
    }

    .bio[hidden] { display: none; }

    .bio {
      max-width: 340px;
      margin: 0 auto;
      color: var(--muted);
      font-family: var(--display-font);
      font-size: 15px;
      font-style: italic;
      font-weight: 400;
      letter-spacing: 0.005em;
      line-height: 1.75;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0 20px;
      color: rgba(var(--accent-rgb), 0.75);
      font-size: 10px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1));
    }

    .divider::after { transform: rotate(180deg); }

    /* --------------------------- Audio player ---------------------- */
    .player {
      position: relative;
      padding: 19px 19px 16px;
      border: 1px solid rgba(255, 255, 255, 0.085);
      border-radius: 23px;
      background: rgba(12, 5, 8, 0.4);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025), 0 12px 35px rgba(0, 0, 0, 0.12);
      transform: translate3d(var(--player-x, 0px), var(--player-y, 0px), 0);
      will-change: transform;
    }

    .track-row {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 52px;
      align-items: center;
      gap: 14px;
    }

    .track-art {
      position: relative;
      width: 52px;
      aspect-ratio: 1;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 50%;
      background:
        repeating-radial-gradient(circle, transparent 0 4px, rgba(255, 255, 255, 0.055) 4.5px 5px),
        conic-gradient(from 35deg, #e52722, #1b0c10 25%, #e8d0c2 52%, #1a0a0d 74%, #b11518);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
    }

    .track-art::before {
      content: "";
      position: absolute;
      inset: 16px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      background: #e8d0c2;
      box-shadow: inset 0 0 0 5px #2b1418;
    }

    .track-art::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: linear-gradient(125deg, rgba(255, 255, 255, 0.19), transparent 35%);
    }

    .is-playing .track-art { animation: spin 9s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .track-copy { min-width: 0; }

    .player-label {
      display: block;
      margin-bottom: 4px;
      color: var(--subtle);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .track-title {
      margin: 0;
      overflow: hidden;
      color: #f1e5dd;
      font-size: 14px;
      font-weight: 550;
      letter-spacing: -0.01em;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-artist {
      margin: 3px 0 0;
      overflow: hidden;
      color: var(--subtle);
      font-size: 11px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .play-button {
      position: relative;
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: #281315;
      background: linear-gradient(145deg, #fff8f0, #e8d0c2);
      box-shadow: 0 8px 24px rgba(var(--accent-rgb), 0.2), inset 0 1px 1px #fff;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .play-button .icon { width: 19px; height: 19px; }
    .play-button .play-icon { margin-left: 3px; }
    .play-button .pause-icon { display: none; }
    .is-playing .play-button .play-icon { display: none; }
    .is-playing .play-button .pause-icon { display: block; }

    .play-button.is-loading .icon { visibility: hidden; }
    .play-button.is-loading::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(40, 19, 21, 0.25);
      border-top-color: #281315;
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    .timeline {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 30px;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
    }

    .time {
      color: #7e7c8b;
      font-size: 9px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .time:last-child { text-align: right; }

    input[type="range"] {
      --progress: 0%;
      width: 100%;
      height: 16px;
      margin: 0;
      padding: 0;
      border: 0;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(to right, var(--accent) 0 var(--progress), rgba(255, 255, 255, 0.11) var(--progress) 100%);
    }

    input[type="range"]::-moz-range-track {
      width: 100%;
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(to right, var(--accent) 0 var(--progress), rgba(255, 255, 255, 0.11) var(--progress) 100%);
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 11px;
      height: 11px;
      margin-top: -4px;
      border: 0;
      border-radius: 50%;
      appearance: none;
      -webkit-appearance: none;
      background: #fff1e8;
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.1), 0 2px 6px rgba(0, 0, 0, 0.35);
      transition: box-shadow 160ms ease;
    }

    input[type="range"]::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border: 0;
      border-radius: 50%;
      background: #fff1e8;
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.1), 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    input[type="range"]:disabled { opacity: 0.38; cursor: not-allowed; }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.055);
    }

    .icon-button {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      color: #9a7f82;
      background: transparent;
      cursor: pointer;
      transition: color 160ms ease, background 160ms ease;
    }

    .icon-button svg { width: 17px; height: 17px; }
    .icon-button .muted-icon { display: none; }
    .icon-button.is-muted .volume-icon { display: none; }
    .icon-button.is-muted .muted-icon { display: block; }

    .volume-slider { flex: 1; max-width: none; }
    .volume-row input[type="range"]::-webkit-slider-thumb { width: 9px; height: 9px; margin-top: -3px; }
    .volume-row input[type="range"]::-moz-range-thumb { width: 9px; height: 9px; }

    .volume-value {
      min-width: 30px;
      color: #806b6e;
      font-size: 9px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .player-status {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      min-height: 15px;
      margin: 9px 0 0;
      color: #8a7376;
      font-size: 10px;
      line-height: 1.5;
    }

    .player-status::before {
      content: "";
      flex: 0 0 auto;
      width: 4px;
      height: 4px;
      margin-top: 5px;
      border-radius: 50%;
      background: #625f6e;
      transition: background 200ms ease, box-shadow 200ms ease;
    }

    .is-playing .player-status::before {
      background: var(--mint);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.22);
    }

    .player-status.is-error { color: var(--danger); }
    .player-status.is-error::before { background: var(--danger); }

    audio { display: none; }

    /* ---------------------- Interaction & focus -------------------- */
    @media (hover: hover) {
      .profile-card:hover {
        border-color: rgba(255, 255, 255, 0.18);
        box-shadow: 0 36px 100px rgba(0, 0, 0, 0.53), 0 3px 12px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
      .play-button:hover { transform: translateY(-2px) scale(1.025); box-shadow: 0 12px 30px rgba(var(--accent-rgb), 0.3), inset 0 1px 1px #fff; }
      .icon-button:hover { color: #eeebf5; background: rgba(255, 255, 255, 0.055); }
      input[type="range"]:hover::-webkit-slider-thumb { box-shadow: 0 0 0 5px rgba(var(--accent-rgb), 0.14), 0 2px 6px rgba(0, 0, 0, 0.35); }
    }

    .play-button:active { transform: scale(0.96); }

    button:focus-visible,
    input[type="range"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    /* --------------------------- Responsive ------------------------ */
    @media (max-width: 390px) {
      body { padding: 16px 13px; }
      .profile-card { padding: 28px 20px 22px; border-radius: 28px; }
      .avatar-shell { width: 108px; margin-bottom: 21px; }
      h1 { font-size: clamp(36px, 11vw, 43px); }
      .bio { font-size: 13px; line-height: 1.7; }
      .divider { margin: 21px 0 17px; }
      .player { padding: 16px 15px 14px; border-radius: 20px; }
      .track-row { grid-template-columns: 46px minmax(0, 1fr) 48px; gap: 11px; }
      .track-art { width: 46px; }
      .track-art::before { inset: 14px; }
      .play-button { width: 48px; height: 48px; }
      .volume-slider { max-width: none; }
    }

    @media (max-height: 700px) and (min-width: 600px) {
      body { padding-top: 20px; padding-bottom: 20px; }
      .profile-card { padding-top: 28px; padding-bottom: 23px; }
      .avatar-shell { width: 106px; margin-bottom: 19px; }
      .divider { margin-top: 19px; margin-bottom: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <audio id="audio" src="./damnright.mp3" preload="none"></audio>

  <script>
    /* ================================================================
       PLAYER LOGIC — no content edits are needed below this point.
       Use PROFILE_CONFIG at the top of this file to personalize it.
       ================================================================ */
    (() => {
      "use strict";

      const config = window.PROFILE_CONFIG;
      const card = document.getElementById("profileCard");
      const profileMain = document.getElementById("profileMain");
      const entryGate = document.getElementById("entryGate");
      const image = document.getElementById("profileImage");
      const audio = document.getElementById("audio");
      const playButton = document.getElementById("playButton");
      const muteButton = document.getElementById("muteButton");
      const volumeSlider = document.getElementById("volumeSlider");
      const volumeValue = document.getElementById("volumeValue");
      const seekSlider = document.getElementById("seekSlider");
      const currentTime = document.getElementById("currentTime");
      const duration = document.getElementById("duration");
      const playerStatus = document.getElementById("playerStatus");
      const builtInPortrait = image.getAttribute("src");

      let lastAudibleVolume = 0.65;
      let hasInteracted = false;
      let hasEntered = false;
      let isStarting = false;
      let isSeeking = false;

      // Apply the user's content from the configuration block.
      document.getElementById("profileName").textContent = config.name;
      const roleElement = document.getElementById("profileRole");
      roleElement.textContent = config.role;
      roleElement.hidden = !config.role || !config.role.trim();
      const bioElement = document.getElementById("profileBio");
      bioElement.textContent = config.bio;
      bioElement.hidden = !config.bio || !config.bio.trim();
      document.getElementById("trackTitle").textContent = config.trackTitle;
      document.getElementById("trackArtist").textContent = config.trackArtist;
      document.getElementById("entryName").textContent = config.name;
      document.getElementById("entryTrack").textContent = `${config.trackTitle} · sound on`;
      entryGate.setAttribute("aria-label", `Enter ${config.name}'s profile and play ${config.trackTitle}`);
      document.title = `${config.name} · Profile`;
      image.alt = `${config.name}'s profile picture`;

      if (config.profileImageUrl && config.profileImageUrl.trim()) {
        image.src = config.profileImageUrl.trim();
      }

      // If a custom image fails, keep the card intact with the built-in portrait.
      image.addEventListener("error", () => {
        if (image.src !== builtInPortrait) {
          image.src = builtInPortrait;
        }
      });

      const audioPath = config.audioFileName && config.audioFileName.trim()
        ? config.audioFileName.trim()
        : "./damnright.mp3";
      audio.src = audioPath;

      function paintRange(input, percent) {
        const safePercent = Math.min(100, Math.max(0, Number.isFinite(percent) ? percent : 0));
        input.style.setProperty("--progress", `${safePercent}%`);
      }

      function formatTime(value) {
        if (!Number.isFinite(value) || value < 0) return "--:--";
        const totalSeconds = Math.floor(value);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${minutes}:${String(seconds).padStart(2, "0")}`;
      }

      function setStatus(message, isError = false) {
        playerStatus.textContent = message;
        playerStatus.classList.toggle("is-error", isError);
      }

      function updatePlayUI() {
        const isPlaying = !audio.paused && !audio.ended;
        card.classList.toggle("is-playing", isPlaying);
        playButton.setAttribute("aria-pressed", String(isPlaying));
        playButton.setAttribute("aria-label", `${isPlaying ? "Pause" : "Play"} ${config.trackTitle}`);
      }

      function updateVolumeUI() {
        const effectiveVolume = audio.muted ? 0 : audio.volume;
        const percent = Math.round(effectiveVolume * 100);
        volumeSlider.value = String(effectiveVolume);
        volumeValue.textContent = `${percent}%`;
        volumeSlider.setAttribute("aria-valuetext", `${percent} percent`);
        muteButton.classList.toggle("is-muted", effectiveVolume === 0);
        muteButton.setAttribute("aria-label", effectiveVolume === 0 ? "Unmute audio" : "Mute audio");
        paintRange(volumeSlider, percent);
      }

      function updateTimeline() {
        if (!isSeeking) {
          seekSlider.value = String(audio.currentTime || 0);
          currentTime.textContent = formatTime(audio.currentTime || 0);
          seekSlider.setAttribute("aria-valuetext", `${formatTime(audio.currentTime || 0)} elapsed`);
        }
        const max = Number(seekSlider.max) || 100;
        paintRange(seekSlider, (Number(seekSlider.value) / max) * 100);
      }

      // Start at a gentle volume; never autoplay.
      const configuredVolume = Number(config.initialVolume);
      const startingVolume = Number.isFinite(configuredVolume)
        ? Math.min(1, Math.max(0, configuredVolume))
        : 0.65;
      audio.volume = startingVolume;
      lastAudibleVolume = startingVolume > 0 ? startingVolume : 0.65;
      updateVolumeUI();
      paintRange(seekSlider, 0);

      async function startPlayback() {
        hasInteracted = true;
        if (isStarting) return;
        isStarting = true;
        playButton.classList.add("is-loading");
        setStatus("Loading…");

        try {
          if (audio.ended) audio.currentTime = 0;
          // Reload after a previous error so adding the file enables an easy retry.
          if (audio.error) audio.load();
          await audio.play();
        } catch (error) {
          if (error && error.name === "NotAllowedError") {
            setStatus("Tap play to enable sound", true);
          } else if (!audio.error || audio.error.code !== MediaError.MEDIA_ERR_ABORTED) {
            setStatus(`Audio not found. Add ${audioPath} next to index.html, then retry.`, true);
          }
        } finally {
          isStarting = false;
          playButton.classList.remove("is-loading");
          updatePlayUI();
        }
      }

      playButton.addEventListener("click", () => {
        hasInteracted = true;
        if (!audio.paused && !audio.ended) {
          audio.pause();
        } else {
          startPlayback();
        }
      });

      // This user gesture unlocks audible playback on desktop and mobile browsers.
      entryGate.addEventListener("click", () => {
        if (hasEntered) return;
        hasEntered = true;
        hasInteracted = true;
        document.body.classList.add("is-entered");
        profileMain.inert = false;
        profileMain.focus({ preventScroll: true });
        entryGate.classList.add("is-leaving");
        entryGate.setAttribute("aria-hidden", "true");
        entryGate.tabIndex = -1;
        startPlayback();
        window.setTimeout(() => { entryGate.hidden = true; }, 700);
      });

      audio.addEventListener("playing", () => {
        updatePlayUI();
        setStatus("Playing");
      });

      audio.addEventListener("pause", () => {
        updatePlayUI();
        if (!audio.ended && audio.currentTime > 0) setStatus("Paused");
      });

      audio.addEventListener("ended", () => {
        updatePlayUI();
        seekSlider.value = "0";
        currentTime.textContent = "0:00";
        paintRange(seekSlider, 0);
        setStatus("Finished");
      });

      audio.addEventListener("waiting", () => {
        if (hasInteracted && !audio.paused) setStatus("Buffering…");
      });

      audio.addEventListener("error", () => {
        playButton.classList.remove("is-loading");
        updatePlayUI();
        if (hasInteracted) {
          setStatus(`Audio not found. Add ${audioPath} next to index.html, then retry.`, true);
        }
      });

      function loadDuration() {
        if (Number.isFinite(audio.duration)) {
          duration.textContent = formatTime(audio.duration);
          seekSlider.max = String(audio.duration);
          seekSlider.disabled = false;
          updateTimeline();
        }
      }

      audio.addEventListener("loadedmetadata", loadDuration);
      audio.addEventListener("durationchange", loadDuration);
      audio.addEventListener("timeupdate", updateTimeline);

      seekSlider.addEventListener("input", () => {
        isSeeking = true;
        const previewTime = Number(seekSlider.value);
        currentTime.textContent = formatTime(previewTime);
        seekSlider.setAttribute("aria-valuetext", `${formatTime(previewTime)} selected`);
        paintRange(seekSlider, (previewTime / Number(seekSlider.max)) * 100);
      });

      seekSlider.addEventListener("change", () => {
        if (Number.isFinite(audio.duration)) {
          audio.currentTime = Number(seekSlider.value);
        }
        isSeeking = false;
        updateTimeline();
      });

      volumeSlider.addEventListener("input", () => {
